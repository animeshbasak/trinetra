<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #e7e2d8; }
      #root { position: relative; width: 100%; height: 100%; }
      #ground { position: absolute; inset: 0; background: #e7e2d8; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="24.4" data-width="1920" data-height="1080">
      <div id="ground"></div>
      <div id="menu" data-composition-id="menu" data-composition-src="compositions/menu.html"
           data-start="0" data-duration="20" data-track-index="1" data-track-kind="graphics"
           data-width="1920" data-height="1080"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html"
           data-start="20" data-duration="4.4" data-track-index="2" data-track-kind="graphics"
           data-width="1920" data-height="1080"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
