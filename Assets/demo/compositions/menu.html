  <script>
    (function () {
      // Sparklines: deterministic shapes, ending on the screenshot's character (flat CPU, busy GPU, a spike on network).
      function line(id, fn) {
        const pts = [];
        for (let i = 0; i <= 34; i++) { const x = i * (70 / 34); pts.push(x.toFixed(1) + "," + Math.max(1, Math.min(19, fn(i))).toFixed(1)); }
        document.querySelector(id).setAttribute("points", pts.join(" "));
      }
      line("#m-s1", i => 15 + Math.sin(i * 1.3) * 1.2);
      line("#m-s2", i => 10 + Math.sin(i * 0.9) * 5 + Math.sin(i * 2.7) * 2.5);
      line("#m-s3", i => 9.5 + Math.sin(i * 0.2) * 0.4);
      line("#m-s4", i => 13 + Math.sin(i * 1.7) * 0.8);
      line("#m-s5", i => i < 4 ? 19 - i * 4 : 4 + Math.sin(i * 0.8) * 0.5);
      line("#m-s6", i => (i === 30 ? 2 : i === 31 ? 8 : 18 - Math.abs(Math.sin(i * 0.7)) * 0.8));

      const tl = gsap.timeline({ paused: true });
      const E = "expo.out", CAM = "power2.inOut";

      // initial state
      gsap.set("#m-panelwrap", { opacity: 0, scale: 0.12, y: -20 });
      gsap.set("#m-desk", { y: 0 });
      gsap.set("#m-cursor", { x: 760, y: 1120 });
            ["#m-s1", "#m-s2", "#m-s3", "#m-s4", "#m-s5", "#m-s6"].forEach(s => gsap.set(s, { attr: { "stroke-dasharray": "1 1", "stroke-dashoffset": 0.5 } }));

      // captions: per word blur in, hold dead still, blur out
      function caption(id, start, dur) {
        const words = "#" + id + " .w";
        tl.fromTo(words, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.07, ease: "power2.out" }, start + 0.05);
        tl.to(words, { opacity: 0, filter: "blur(6px)", duration: 0.18, stagger: 0.02, ease: "power3.in" }, start + dur - 0.42);
      }
      caption("m-c1", 0.3, 3.2);
      caption("m-c2", 3.7, 3.4);
      caption("m-c3", 7.3, 3.7);
      caption("m-c4", 11.3, 3.9);
      caption("m-c5", 15.4, 4.6);

      // S1: cursor to the eye, click, menu opens out of the eye
      tl.fromTo("#m-cursor", { x: 760, y: 1120 }, { x: 1402, y: 22, duration: 1.0, ease: "power3.inOut" }, 0.25);
      tl.to("#m-cursor", { scale: 0.88, duration: 0.07, yoyo: true, repeat: 1, transformOrigin: "0 0" }, 1.3);
      tl.to("#m-eyecap", { backgroundColor: "rgba(255,255,255,0.18)", duration: 0.1 }, 1.32);
      tl.fromTo("#m-panelwrap", { opacity: 0, scale: 0.12, y: -20 }, { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: E }, 1.36);

      // S2: cursor to the switch, click, lid mode on
      tl.to("#m-cursor", { x: 1736, y: 341, duration: 0.7, ease: "power3.inOut" }, 3.5);
      tl.to("#m-cursor", { scale: 0.88, duration: 0.07, yoyo: true, repeat: 1, transformOrigin: "0 0" }, 4.25);
      tl.to("#m-knob", { x: 13, duration: 0.18, ease: "power3.out" }, 4.3);
      tl.to("#m-swon", { opacity: 1, duration: 0.18 }, 4.3);
      tl.to(["#m-h1", "#m-l1", "#m-warn"], { opacity: 0, filter: "blur(4px)", duration: 0.15 }, 4.38);
      tl.fromTo(["#m-h2", "#m-l2", "#m-reason"], { opacity: 0, filter: "blur(4px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2 }, 4.5);
      tl.to("#m-eye-open", { opacity: 0, duration: 0.12 }, 4.45);
      tl.to("#m-eye-lid", { opacity: 1, duration: 0.12 }, 4.45);
      tl.to("#m-cursor", { x: 1960, y: 700, duration: 0.6, ease: "power3.in" }, 5.6);

      // S3: camera to Agents, summary counts up
      tl.to("#m-desk", { y: -165, duration: 0.7, ease: CAM }, 7.0);
      const n = { a: 44, b: 27, c: 301, d: 128 };
      tl.fromTo(n, { a: 44, b: 27, c: 301, d: 128 }, { a: 48, b: 30, c: 336, d: 140, duration: 1.4, ease: "power2.out", onUpdate: () => {
        document.querySelector("#m-n1").textContent = Math.round(n.a);
        document.querySelector("#m-n2").textContent = Math.round(n.b);
        document.querySelector("#m-n3").textContent = Math.round(n.c);
        const m = Math.round(n.d); document.querySelector("#m-n4").textContent = (m >= 60 ? Math.floor(m / 60) + "h " : "") + (m % 60) + "m";
      } }, 7.6);

      // S4: camera to System, tiles fill, values count, sparklines draw
      tl.to("#m-desk", { y: -620, duration: 0.7, ease: CAM }, 11.0);
            ["#m-s1", "#m-s2", "#m-s3", "#m-s4", "#m-s5", "#m-s6"].forEach((s, i) => tl.fromTo(s, { attr: { "stroke-dashoffset": 0.5 } }, { attr: { "stroke-dashoffset": 0 }, duration: 1.4, ease: "power1.inOut" }, 11.65 + i * 0.06));
      const v = { a: 11, b: 52, c: 25.1, d: 42, e: 17.6, f: 0 };
      tl.fromTo(v, { a: 11, b: 52, c: 25.1, d: 42, e: 17.6, f: 0 }, { a: 13, b: 58, c: 25.2, d: 43, e: 18.3, f: 482, duration: 1.0, ease: "power2.out", onUpdate: () => {
        document.querySelector("#m-v1").textContent = Math.round(v.a);
        document.querySelector("#m-v2").textContent = Math.round(v.b);
        document.querySelector("#m-v3").textContent = v.c.toFixed(1);
        document.querySelector("#m-v4").textContent = Math.round(v.d);
        document.querySelector("#m-v5").textContent = v.e.toFixed(1);
        document.querySelector("#m-v6").textContent = Math.round(v.f);
      } }, 11.65);

      // S5: today line, then back to the top; the agent finishes, the eye closes
      tl.to("#m-desk", { y: -1015, duration: 0.7, ease: CAM }, 15.2);
      tl.fromTo("#m-today", { opacity: 0.35 }, { opacity: 1, duration: 0.4 }, 15.7);
      tl.to("#m-desk", { y: 0, duration: 0.7, ease: CAM }, 17.0);
      tl.to(["#m-h2", "#m-reason", "#m-l2", "#m-act1", "#m-t1"], { opacity: 0, filter: "blur(4px)", duration: 0.15 }, 17.8);
      tl.fromTo(["#m-h3", "#m-l3", "#m-act2", "#m-t2"], { opacity: 0, filter: "blur(4px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2 }, 17.9);
      tl.to("#m-dot", { backgroundColor: "#7a7a84", duration: 0.2 }, 17.85);
      tl.to("#m-eye-lid", { opacity: 0, duration: 0.12 }, 17.95);
      tl.to("#m-eye-idle", { opacity: 1, duration: 0.12 }, 17.95);
      tl.to("#m-readout", { opacity: 0.55, duration: 0.2 }, 17.95);
