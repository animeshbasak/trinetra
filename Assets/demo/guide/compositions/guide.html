  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const outs = ["#g-o1", "#g-o2a", "#g-o2b", "#g-o2c", "#g-o3a", "#g-o6a", "#g-o6b"];
      gsap.set(outs, { opacity: 0 });
      gsap.set("#g-cursor", { x: 2000, y: 700 });

      // typing: a counter per command line, text written from timeline time only
      function type(id, text, at, dur) {
        const el = document.querySelector(id);
        el.textContent = "";
        const o = { n: 0 };
        tl.fromTo(o, { n: 0 }, { n: text.length, duration: dur, ease: "none", onUpdate: () => { el.textContent = text.slice(0, Math.round(o.n)); } }, at);
      }
      function show(id, at) { tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.12 }, at); }

      // rail
      tl.fromTo("#g-head", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2 }, 0.2);
      tl.fromTo(".g-item", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.15, stagger: 0.08 }, 0.6);
      function activate(i, at) {
        const it = "#g-i" + i;
        tl.to(it + " .g-title", { opacity: 1, duration: 0.2 }, at);
        tl.to(it + " .g-badge", { backgroundColor: "#b45309", color: "#ffffff", duration: 0.2 }, at);
        tl.fromTo(it + " .g-detail", { opacity: 0, filter: "blur(4px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2 }, at + 0.1);
      }
      function complete(i, at) {
        const it = "#g-i" + i;
        tl.to(it + " .g-detail", { opacity: 0, duration: 0.15 }, at);
        tl.to(it + " .g-title", { opacity: 0.6, duration: 0.2 }, at);
        tl.to(it + " .g-badge", { backgroundColor: "#1a1814", duration: 0.2 }, at);
        tl.to(it + " .n", { opacity: 0, duration: 0.1 }, at);
        tl.to(it + " .ok", { opacity: 1, duration: 0.1 }, at + 0.05);
      }
      // stages swap with a blur on one stage, ground never cuts
      function stage(id, start, dur) {
        tl.fromTo(id + " > *", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2 }, start + 0.02);
        tl.to(id + " > *", { opacity: 0, filter: "blur(8px)", duration: 0.15 }, start + dur - 0.2);
      }

      // 1. install the CLI
      activate(1, 2.8); stage("#g-s1", 2.8, 5.6);
      type("#g-t1a", "git clone https://github.com/animeshbasak/trinetra.git", 3.2, 1.3);
      type("#g-t1b", "cd trinetra && scripts/install-cli.sh", 4.8, 0.9);
      show("#g-o1", 6.1);
      complete(1, 8.3);

      // 2. connect agents
      activate(2, 8.4); stage("#g-s2", 8.4, 6.6);
      type("#g-t2a", "trinetra hooks install claude", 8.8, 0.8);
      show("#g-o2a", 9.9); show("#g-o2b", 10.15);
      type("#g-t2b", "trinetra hooks install codex", 11.0, 0.8);
      show("#g-o2c", 12.0);
      type("#g-t2c", "trinetra hooks install gemini && trinetra hooks install cursor", 12.9, 1.3);
      complete(2, 14.9);

      // 3. build and install the app
      activate(3, 15.0); stage("#g-s3", 15.0, 5.6);
      type("#g-t3a", "open Trinetra.xcodeproj", 15.4, 0.6);
      show("#g-o3a", 16.3);
      type("#g-t3b", "ditto ~/Library/Developer/Xcode/DerivedData/Trinetra-*/Build/Products/Debug/Trinetra.app /Applications/Trinetra.app", 17.2, 1.6);
      type("#g-t3c", "open /Applications/Trinetra.app", 19.1, 0.6);
      complete(3, 20.5);

      // 4. lid mode on
      activate(4, 20.6); stage("#g-s4", 20.6, 5.0);
      tl.fromTo("#g-cursor", { x: 2000, y: 760 }, { x: 1594, y: 686, duration: 0.8, ease: "power3.inOut" }, 21.3);
      tl.to("#g-cursor", { scale: 0.88, duration: 0.07, yoyo: true, repeat: 1, transformOrigin: "0 0" }, 22.15);
      tl.to("#g-knob", { x: 13, duration: 0.18, ease: "power3.out" }, 22.2);
      tl.to("#g-swon", { opacity: 1, duration: 0.18 }, 22.2);
      tl.to("#g-l1", { opacity: 0, filter: "blur(4px)", duration: 0.15 }, 22.3);
      tl.fromTo("#g-l2", { opacity: 0, filter: "blur(4px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2 }, 22.4);
      tl.to("#g-cursor", { x: 2000, y: 900, duration: 0.5, ease: "power3.in" }, 24.0);
      complete(4, 25.5);

      // 5. allow the helper (real screenshot), ring draws round Trinetra
      activate(5, 25.6); stage("#g-s5", 25.6, 5.4);
      tl.fromTo("#g-ring", { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.8, ease: "power2.inOut" }, 26.4);
      complete(5, 30.9);

      // 6. modules
      activate(6, 31.0); stage("#g-s6", 31.0, 6.0);
      type("#g-t6a", "trinetra modules enable system-monitor", 31.4, 0.9);
      show("#g-o6a", 32.5);
      type("#g-t6b", "trinetra modules enable health-alerts", 33.3, 0.9);
      show("#g-o6b", 34.4);
      complete(6, 36.0);

      window.__timelines["guide"] = tl;
    })();
